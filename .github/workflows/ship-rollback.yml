# `ship rollback <product>` starts this: shipper redeploys an earlier commit that was live in the
# environment, through the normal pipeline (build, deploy, health check, Discord).
name: Ship rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        required: true
        type: string
      sha:
        description: Commit to deploy
        required: true
        type: string

# Rollbacks to one environment run one at a time and are never cut off.
concurrency:
  group: ship-rollback-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ideaSquared/shipper/.github/workflows/deploy.yml@7839bde2edef52a5e58107bbf83e9b9760d7d52a # v1.0.0
    with:
      environment: ${{ inputs.environment }}
      sha: ${{ inputs.sha }}
      rollback: true
      shipper-ref: 7839bde2edef52a5e58107bbf83e9b9760d7d52a
    secrets: inherit
