name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Runs on master go one at a time, in the order they were pushed, so an older commit never deploys after a newer one.
# A newer push to a pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot bumps the shipper SHA in a `uses:` line but not the matching `shipper-ref:` input, so
      # a bump would run the new workflow with the old shipper scripts. Every pin must be the same SHA.
      - name: shipper pins match
        run: |
          refs=$(grep -hvE '^\s*#' .github/workflows/*.y*ml | sed -E 's/[[:space:]]+#.*$//' | grep -oE "uses: *[\"']?ideaSquared/shipper/\.github/workflows/[A-Za-z0-9_.-]+@[0-9a-f]{40}|shipper-ref: *[\"']?[0-9a-f]{40}" | grep -oE '[0-9a-f]{40}' | sort -u)
          if [ "$(printf '%s\n' "$refs" | grep -c .)" -gt 1 ]; then
            echo "::error::Every shipper pin in .github/workflows (each uses: line and each shipper-ref input) must be the same commit SHA. Found: $(echo $refs)"
            exit 1
          fi
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Fails when worker-configuration.d.ts no longer matches wrangler.jsonc (run `pnpm cf-typegen`).
      - run: pnpm exec wrangler types --check
      - run: pnpm typecheck
      - run: pnpm test --run
      # Server code logs through @ideasquared/log, never console (see .claude/skills/logging).
      # A justified exception carries `// logging-exempt: <reason>` on the same line.
      - name: No console calls in server code
        run: |
          if grep -rnE '\bconsole\.(log|info|warn|error|debug|trace)\(' src --include='*.ts' | grep -v 'logging-exempt:'; then
            echo "::error::Log through @ideasquared/log instead of console. See .claude/skills/logging/SKILL.md."
            exit 1
          fi
      # Builds the Worker as a deploy does, without deploying it.
      - name: build
        run: pnpm exec wrangler deploy --dry-run

  # Deploys master through ideaSquared/shipper once the tests pass: gate, wrangler deploy, /health check
  # (rolls back if it fails). See ship.yaml.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ideaSquared/shipper/.github/workflows/deploy.yml@7839bde2edef52a5e58107bbf83e9b9760d7d52a # v1.0.0
    with:
      environment: production
      shipper-ref: 7839bde2edef52a5e58107bbf83e9b9760d7d52a
    secrets: inherit
