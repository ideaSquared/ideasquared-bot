name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Runs on master go one at a time, in the order they were pushed, so an older commit never deploys after a newer one.
concurrency:
  group: ${{ github.ref == 'refs/heads/master' && 'master' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Dependabot bumps the shipper SHA in a `uses:` line but not the matching `shipper-ref:` input, so
      # a bump would run the new workflow with the old shipper scripts. Every pin must be the same SHA.
      - name: shipper pins match
        run: |
          refs=$(grep -rhoE 'ideaSquared/shipper/\.github/workflows/[A-Za-z0-9_.-]+@[0-9a-f]{40}|shipper-ref: *[0-9a-f]{40}' .github/workflows | grep -oE '[0-9a-f]{40}$' | sort -u)
          if [ "$(printf '%s\n' "$refs" | grep -c .)" -gt 1 ]; then
            echo "::error::Every shipper pin in .github/workflows (each uses: line and each shipper-ref input) must be the same commit SHA. Found: $(echo $refs)"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      # Server code logs through @ideasquared/log, never console (see .claude/skills/logging).
      # A justified exception carries `// logging-exempt: <reason>` on the same line.
      - name: No console calls in server code
        run: |
          if grep -rnE '\bconsole\.(log|info|warn|error|debug|trace)\(' src --include='*.ts' | grep -v 'logging-exempt:'; then
            echo "::error::Log through @ideasquared/log instead of console. See .claude/skills/logging/SKILL.md."
            exit 1
          fi
      # Builds the Worker as a deploy does, without deploying it.
      - run: pnpm exec wrangler deploy --dry-run

  # Deploys master through ideaSquared/shipper once the tests pass: gate, wrangler deploy, /health check
  # (rolls back if it fails). See ship.yaml.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      checks: read
      deployments: write
    uses: ideaSquared/shipper/.github/workflows/deploy.yml@faf1fd936bcba4dd2f1a60ce33f18298ca1cb19c # v1
    with:
      environment: production
      shipper-ref: faf1fd936bcba4dd2f1a60ce33f18298ca1cb19c
    secrets: inherit
