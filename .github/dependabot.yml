# Dependabot keeps the GitHub Actions current, including the pinned ideaSquared/shipper commit
# in the deploy workflow.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    commit-message:
      prefix: chore(ci)
